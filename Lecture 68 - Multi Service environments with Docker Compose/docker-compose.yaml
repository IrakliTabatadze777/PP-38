name: trip-app

services:

  db:
    image: postgres:18
    container_name: trip-db
    environment:
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: trip
      POSTGRES_DB: trip
    ports:
      - "5432:5432"
    volumes:
      - trip-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip -d trip"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - trip-network

  api:
    container_name: trip-api
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-some_api_key}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trip-network


  ui:
    container_name: trip-ui
    build:
      context: .
      dockerfile: ui.Dockerfile
    env_file:
      - .env.ui
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - trip-network


volumes:
  trip-data:

networks:
  trip-network: