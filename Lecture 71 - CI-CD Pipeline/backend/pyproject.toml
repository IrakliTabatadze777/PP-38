[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Customer support agent: FastAPI, LangChain, LangGraph (RAG, ReAct, HITL)"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["app/db/migrations/versions", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not slow and not live'"
markers = [
    "slow: needs a real embedding model (retrieval golden set)",
    "live: calls a real LLM",
]
